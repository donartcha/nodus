syntax = "proto3";

package nodus;

import "nodus/common.proto";

option go_package = "github.com/nodus/grpc-go/nodus";
option java_multiple_files = true;
option java_package = "bot.nodus.proto";

service WebService {
  rpc CheckIsImageUrl(StringRequest) returns (IsImageUrl);
  rpc FetchOpenGraphData(StringRequest) returns (OpenGraphData);
  rpc OpenInBrowser(StringRequest) returns (Empty);
}

message IsImageUrl {
  bool is_image = 1;
  string url = 2;
}

message OpenGraphData {
  string title = 1;
  string description = 2;
  string image = 3;
  string url = 4;
  string site_name = 5;
  string type = 6;
}


